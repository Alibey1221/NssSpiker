name: APK derle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android lisanslarini kabul et
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Projeyi ac
        run: unzip -o proj.zip

      - name: Derle
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: APK olusmus mu kontrol et
        run: |
          ls -la app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nss-spiker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NSS Spiker build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
